name: Deploy Election Campaign OS

# WHY THIS EXISTS
#
# Deployment was blocked for several sessions on one thing: no Google
# credential could reach the build container. That is a property of that
# container, not of the project — GitHub Actions has no such limitation,
# and a repository secret is a path the account owner already knows.
#
# So this routes around the block. Add one secret and a handful of
# config values, press Run workflow, and the deploy happens here.
#
# WHAT IT REFUSES TO DO
#
# It will not deploy a build that has not passed the full check suite,
# and it will not deploy past `npm run preflight` — the same preflight
# that refuses a stale `dist`, a function missing its africa-south1
# region pin, a rules file with an allow-all, or a web config naming a
# different project than the one being deployed to.
#
# It is manual by default (`workflow_dispatch`). Automatic deploys on
# every push to a repository holding a campaign's voter data is a
# decision for a person to make deliberately — uncomment the `push`
# trigger when that decision has been made.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        required: true
        default: hosting
        type: choice
        options:
          - hosting
          - rules
          - functions
          - everything
  # push:
  #   branches: [main]
  #   paths: ['election-cos-app/**']

permissions:
  contents: read
  id-token: write # keyless Google sign-in (Workload Identity Federation); no key secret needed

concurrency:
  # Two deploys racing each other to the same project is how a half-built
  # bundle ends up live.
  group: deploy-ecos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: election-cos-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: election-cos-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Sign in to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/960903975002/locations/global/workloadIdentityPools/github/providers/github-oidc' }}
          service_account: ${{ vars.GCP_SITE_DEPLOYER || 'ecos-site-deployer@electioncos1-0.iam.gserviceaccount.com' }}

      # The web config is compiled into the bundle, so it exists before the build. It is not secret (a Firebase web config is
      # public by design; security comes from firestore.rules). Read from the project itself, so no variables need setting.
      - name: Write .env from the registered web app
        env:
          APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || '1:960903975002:web:77cb23f705bf9eb7d4c863' }}
        run: |
          npx firebase apps:sdkconfig web "$APP_ID" --project electioncos1-0 --json > "$RUNNER_TEMP/cfg.json"
          node -e "
          const c=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/cfg.json','utf8')).result.sdkConfig;
          const k={VITE_FIREBASE_API_KEY:c.apiKey,VITE_FIREBASE_AUTH_DOMAIN:c.authDomain,VITE_FIREBASE_PROJECT_ID:c.projectId,VITE_FIREBASE_STORAGE_BUCKET:c.storageBucket,VITE_FIREBASE_MESSAGING_SENDER_ID:c.messagingSenderId,VITE_FIREBASE_APP_ID:c.appId,VITE_DAL_ADAPTER:'firestore'};
          for(const [n,v] of Object.entries(k)) if(!v) throw new Error('web config missing '+n);
          require('fs').writeFileSync('.env',Object.entries(k).map(([n,v])=>n+'='+v).join('\n')+'\n');"
          # Deliberately NOT written: VITE_FIREBASE_USE_EMULATORS (the preflight fails if it is set).

      - name: Checks
        # The keyless sign-in exports GOOGLE_APPLICATION_CREDENTIALS pointing at an external-account file, which firebase-admin
        # (imported by the functions tests) rejects. The tests use no cloud credential, so they run without it.
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: npm run check:all

      - name: Build
        run: npm run build

      - name: Preflight
        run: npm run preflight

      - name: Deploy
        run: |
          case "${{ inputs.target }}" in
            hosting)    ONLY="hosting" ;;
            rules)      ONLY="firestore:rules,storage" ;;
            functions)  ONLY="functions" ;;
            everything) ONLY="" ;;
          esac
          if [ -n "$ONLY" ]; then
            npx firebase deploy --only "$ONLY" --project default --non-interactive
          else
            npx firebase deploy --project default --non-interactive
          fi
