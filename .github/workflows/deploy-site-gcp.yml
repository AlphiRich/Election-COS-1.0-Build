name: Deploy public site (Cloud Run)

# Builds dist-site, packs it into the nginx container in
# election-cos-app/site-hosting/gcp, and deploys it to Cloud Run in
# africa-south1, then releases the separate Firebase Hosting site
# `electioncos-site` that fronts it (for the custom domain). The public website
# only: the application, its Hosting site, Firestore and Functions are not
# touched (that is deploy-ecos.yml).
#
# Sign-in is keyless (Workload Identity Federation): no service-account key
# is stored in this repository. Run election-cos-app/scripts/setup-gcp-site.sh
# once in Cloud Shell before the first run.
#
# Manual only. Adverts stay off unless the three VITE_AD_* Actions variables
# are all set; see docs/hosting-gcp-and-cloudflare.md.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for the keyless Google sign-in

concurrency:
  group: deploy-site-gcp
  cancel-in-progress: false

env:
  PROJECT: electioncos1-0
  # Where the Cloud Run service runs. Firebase Hosting can only forward to Cloud
  # Run in a supported region, and africa-south1 is not one of them.
  RUN_REGION: europe-west1
  # Where the image repository is stored (unchanged).
  AR_LOCATION: africa-south1
  SERVICE: ecos-site
  IMAGE: africa-south1-docker.pkg.dev/electioncos1-0/ecos/ecos-site
  RUNTIME_SA: ecos-site-runtime@electioncos1-0.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: election-cos-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: election-cos-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Build site
        env:
          VITE_AD_CLIENT_ID: ${{ vars.VITE_AD_CLIENT_ID }}
          VITE_AD_SLOT_ID: ${{ vars.VITE_AD_SLOT_ID }}
          VITE_AD_CATEGORY_BLOCKS_CONFIRMED: ${{ vars.VITE_AD_CATEGORY_BLOCKS_CONFIRMED }}
        run: npm run build:site && npm run check:site-budget

      # The site's own tests include the nginx/_headers parity check and the
      # unsafe-source guard, so a container with drifted headers never ships.
      - name: Site tests
        run: npm run check:headers && npx vitest run src/site

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/960903975002/locations/global/workloadIdentityPools/github/providers/github-oidc' }}
          service_account: ${{ vars.GCP_SITE_DEPLOYER || 'ecos-site-deployer@electioncos1-0.iam.gserviceaccount.com' }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "$AR_LOCATION-docker.pkg.dev" --quiet
          docker build -f site-hosting/gcp/Dockerfile -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      # Small and capped: a static site needs little, and max-instances bounds
      # the bill if the site is hammered. Scales to zero when idle.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" --region "$RUN_REGION" \
            --image "$IMAGE:$GITHUB_SHA" \
            --service-account "$RUNTIME_SA" \
            --allow-unauthenticated --port 8080 \
            --cpu 1 --memory 256Mi --concurrency 80 \
            --min-instances 0 --max-instances 4 \
            --quiet

      - name: Smoke test
        run: |
          URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$RUN_REGION" --format='value(status.url)')"
          echo "URL=$URL" >> "$GITHUB_ENV"
          code="$(curl -s -o /dev/null -w '%{http_code}' "$URL/")"
          [ "$code" = "200" ] || { echo "::error::$URL/ returned $code"; exit 1; }
          curl -sI "$URL/" | grep -qi '^content-security-policy:' \
            || { echo "::error::$URL/ is missing its Content-Security-Policy header"; exit 1; }
          echo "Site is up at $URL"

      # The second Hosting site (electioncos-site) fronts the Cloud Run
      # service so the custom domain can be connected to it; Cloud Run domain
      # mapping is not offered in africa-south1. The config file names that
      # site explicitly, so this cannot release to the application's site.
      - name: Deploy Firebase Hosting front (electioncos-site)
        run: |
          npx firebase deploy --only hosting \
            --config site-hosting/firebase/firebase.json \
            --project "$PROJECT" --non-interactive

      - name: Smoke test through Firebase Hosting
        run: |
          FRONT="https://electioncos-site.web.app"
          echo "FRONT=$FRONT" >> "$GITHUB_ENV"
          code="$(curl -s -o /dev/null -w '%{http_code}' "$FRONT/")"
          [ "$code" = "200" ] || { echo "::error::$FRONT/ returned $code"; exit 1; }
          curl -sI "$FRONT/" | grep -qi '^content-security-policy:' \
            || { echo "::error::$FRONT/ is missing its Content-Security-Policy header (not passed through from Cloud Run)"; exit 1; }
          echo "Front is up at $FRONT"

      - name: What went live
        if: success()
        run: |
          {
            echo "### Public site deployed"
            echo ""
            echo "Public front: $FRONT (connect electioncos.co.za to this site)"
            echo ""
            echo "Cloud Run origin: $URL"
            echo ""
            echo "Image: \`$IMAGE:$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
